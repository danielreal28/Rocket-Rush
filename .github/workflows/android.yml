name: Build Rocket Rush APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SECRETS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Instalar dependencias
      run: npm install

    - name: Sincronizar Capacitor
      run: npx cap sync

    - name: Compilar APK de prueba (debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir APK debug a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Rocket-Rush-APK-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Preparar keystore de release
      if: env.HAS_RELEASE_SECRETS == 'true'
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/rocket-rush-release.keystore

    - name: Compilar AAB firmado para Play Store
      if: env.HAS_RELEASE_SECRETS == 'true'
      env:
        RELEASE_KEYSTORE_PATH: rocket-rush-release.keystore
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        cd android
        ./gradlew bundleRelease

    - name: Subir AAB firmado (para Play Store)
      if: env.HAS_RELEASE_SECRETS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Rocket-Rush-AAB-release
        path: android/app/build/outputs/bundle/release/app-release.aab
